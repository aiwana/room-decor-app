# RoomDecor: PostgreSQL + Spring Boot backend, for machines that do NOT have the team database yet.
# Run from the backend folder:
#   docker compose up -d --build        (first time, or after code changes)
#   docker compose ps                   (both should be "healthy")
#   docker compose logs -f backend
# Values come from backend/.env (DB_USERNAME, DB_PASSWORD, JWT_SECRET, STORAGE_BASE_URL, GEMINI_API_KEY...).
# Data is kept in the Docker volume roomdecor_pgdata; "docker compose down" keeps it, "down -v" DELETES it.
# Already running the old room-decor-postgres container on port 5433? Use docker-compose.existing-db.yml instead.
# Only want the database (backend run with mvnw)?  docker compose up -d postgres

name: roomdecor

services:
  postgres:
    image: postgres:16-alpine
    container_name: roomdecor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomdecor
      POSTGRES_USER: ${DB_USERNAME:-roomdecor_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env first}
    ports:
      # Only reachable from this machine, on the port application.yml expects
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: roomdecor-backend:local
    container_name: roomdecor-api
    restart: unless-stopped
    # Same .env the backend uses when run with mvnw; the lines under "environment" win over it
    env_file: .env
    environment:
      # Inside Docker the database is reached by service name, not localhost:5433
      DB_URL: jdbc:postgresql://postgres:5432/roomdecor
      UPLOAD_DIR: /app/uploads
    ports:
      # All network interfaces, so a phone on the same Wi-Fi can reach http://<PC IP>:8080
      - "8080:8080"
    volumes:
      # Same folder mvnw uses, so photos uploaded before keep working
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
