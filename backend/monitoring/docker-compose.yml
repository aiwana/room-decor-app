# Monitoring for the RoomDecor backend: Prometheus (collects metrics) + Grafana (dashboard).
# Needs the backend running as container roomdecor-api on network room-decor-net
# (docker-compose.existing-db.yml). Run from the backend\monitoring folder:
#   docker compose up -d --build
#   Prometheus: http://localhost:9090  (Status > Targets, Alerts)
#   Grafana:    http://localhost:3030  (user admin, password = GRAFANA_ADMIN_PASSWORD or "admin" the first time)
#   docker compose down                (keeps data; "down -v" DELETES the collected metrics and Grafana settings)
# Ports are bound to 127.0.0.1: only this PC can open them, never through ngrok.

name: roomdecor-monitoring

services:
  prometheus:
    build: ./prometheus
    image: roomdecor-prometheus:local
    container_name: roomdecor-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    networks:
      - room-decor-net

  grafana:
    build: ./grafana
    image: roomdecor-grafana:local
    container_name: roomdecor-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/roomdecor-backend.json
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - room-decor-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  room-decor-net:
    external: true
