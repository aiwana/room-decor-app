# sonar-project.properties
# Cấu hình SonarQube Scanner cho backend
# Chạy thủ công: npx sonar-scanner (từ thư mục backend/)
# Trong CI: Jenkinsfile truyền các tham số này qua -D flags

sonar.projectKey=room-decor-backend
sonar.projectName=Room Decor Backend
sonar.projectVersion=1.0.0

# Thư mục source
sonar.sources=src
sonar.exclusions=src/**/__tests__/**

# Thư mục test
sonar.tests=src/__tests__

# Coverage (lcov sinh bởi Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test execution report (sinh bởi jest-sonar-reporter)
sonar.testExecutionReportPaths=coverage/test-report.xml

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
