# Cấu hình SonarQube cho backend, dùng khi chạy sonar-scanner trong thư mục backend/.
# Job Jenkins room-decor-ci truyền cùng các giá trị này bằng -D (tham số -D ghi đè file này).
sonar.projectKey=room-decor-app-backend
sonar.projectName=Room Decor AI - Backend
sonar.sourceEncoding=UTF-8

# Code chính và code test phải tách riêng, một file không được nằm ở cả hai.
sonar.sources=src
sonar.exclusions=src/__tests__/**,**/node_modules/**,dist/**,storage/**,coverage/**
sonar.tests=src/__tests__

sonar.typescript.tsconfigPaths=tsconfig.json
# Coverage do "npm run test:ci" sinh ra, phải chạy test trước khi scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
